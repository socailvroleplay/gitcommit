<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commits</title>
<style>
  :root {
    --bg: #1e1f22; --card: #2b2d31; --text: #dbdee1; --head: #f2f3f5;
    --muted: #949ba4; --link: #00a8fc; --code: #1e1f22; --line: #3f4147;
    --merge: #57f287; --push: #5865f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "gg sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 28px 20px 12px; max-width: 760px; width: 100%; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; color: var(--head); font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--merge); margin-right: 6px; vertical-align: 1px; }
  main { flex: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 20px 24px; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button, .filters select {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .filters button.on { border-color: var(--link); color: var(--head); }
  .card {
    background: var(--card); border-left: 4px solid var(--push); border-radius: 4px;
    padding: 12px 16px; margin-bottom: 12px;
  }
  .card.merge { border-left-color: var(--merge); }
  .author { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--head); font-weight: 600; }
  .author img { width: 22px; height: 22px; border-radius: 50%; }
  .author a { color: inherit; text-decoration: none; }
  .title { display: block; color: var(--link); font-weight: 600; font-size: 15px; margin: 6px 0 8px; text-decoration: none; word-break: break-word; }
  .title:hover { text-decoration: underline; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .label { color: var(--head); font-weight: 600; font-size: 13px; margin-top: 6px; }
  code {
    font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 12.5px;
    background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
    word-break: break-all;
  }
  a code { color: var(--link); }
  a:has(code) { text-decoration: none; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .list a { text-decoration: none; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  footer {
    text-align: center; color: var(--muted); font-size: 13px; padding: 20px;
    border-top: 1px solid var(--line);
  }
  footer b { color: var(--head); font-weight: 600; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="site-title">Commits</h1>
  <p><span class="live"></span>Live feed · updates every 30 seconds</p>
</header>

<main>
  <div class="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="merge">Merges</button>
    <button data-f="push">Pushes</button>
    <select id="repo-filter"><option value="">All repos</option></select>
  </div>
  <div id="feed"><div class="empty">Loading commits…</div></div>
</main>

<footer id="credit">Developed by <b>Vision Development</b> / <b>David Conway</b></footer>

<script>
  const feed = document.getElementById("feed");
  const repoSel = document.getElementById("repo-filter");
  let entries = [];
  let typeFilter = "all";

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https:\/\//.test(u || "") ? esc(u) : "#");

  function timeAgo(iso) {
    const d = new Date(iso);
    const s = Math.floor((Date.now() - d) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " hr ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  function card(e) {
    const isMerge = e.type === "merge";
    const message = e.type === "multi"
      ? '<div class="list">' + e.commits.map((c) =>
          `<div><a href="${safeUrl(c.url)}" target="_blank" rel="noopener"><code>${esc(c.sha)}</code></a> ${esc(c.message)}</div>`
        ).join("") + "</div>"
      : (e.message && e.message !== e.title ? `<div class="msg">${esc(e.message)}</div>` : "");
    const status = isMerge ? `Merged · ${esc(e.source)} → ${esc(e.branch)}` : "Pushed";
    const when = new Date(e.time).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

    return `
      <article class="card ${isMerge ? "merge" : ""}">
        <div class="author">
          <img src="${safeUrl(e.avatar)}" alt="" />
          <a href="${safeUrl(e.authorUrl)}" target="_blank" rel="noopener">${esc(e.author)}</a>
        </div>
        <a class="title" href="${safeUrl(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
        <div class="grid">
          <div><div class="label">Repo</div><code>${esc(e.repo)}</code></div>
          <div><div class="label">Branch</div><code>${esc(e.branch)}</code></div>
          <div><div class="label">Commit</div><a href="${safeUrl(e.url)}" target="_blank" rel="noopener"><code>${esc(e.sha)}</code></a></div>
        </div>
        ${message ? `<div class="label">Message</div>${message}` : ""}
        <div class="foot" title="${esc(when)}">${status} · ${timeAgo(e.time)}</div>
      </article>`;
  }

  function render() {
    const repo = repoSel.value;
    const list = entries.filter((e) =>
      (typeFilter === "all" || (typeFilter === "merge" ? e.type === "merge" : e.type !== "merge")) &&
      (!repo || e.repo === repo)
    );
    feed.innerHTML = list.length ? list.map(card).join("") : '<div class="empty">No commits yet</div>';
  }

  function fillRepos() {
    const current = repoSel.value;
    const repos = [...new Set(entries.map((e) => e.repo))].sort();
    repoSel.innerHTML = '<option value="">All repos</option>' +
      repos.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
    repoSel.value = repos.includes(current) ? current : "";
  }

  async function load() {
    try {
      const r = await fetch("/api/commits");
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      entries = data.entries || [];
      document.getElementById("site-title").textContent = data.title;
      document.title = data.title;
      fillRepos();
      render();
    } catch (err) {
      if (!entries.length) feed.innerHTML = '<div class="empty">Could not load commits. Try again in a moment.</div>';
    }
  }

  document.querySelectorAll(".filters button").forEach((b) =>
    b.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      typeFilter = b.dataset.f;
      render();
    })
  );
  repoSel.addEventListener("change", render);

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
